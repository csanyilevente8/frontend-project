server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets directly; fall back to index.html so Angular's
    # client-side router handles unknown paths (SPA routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic caching for fingerprinted static assets.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Do not cache index.html so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
